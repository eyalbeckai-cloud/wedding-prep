<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6f4">
<title>יום ההתארגנות של שקד ואיל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: soft blush page, white cards with hairline borders; dusty-rose accent with champagne-gold details */
  --bg:#fbf6f4;--surface:#ffffff;--ink:#3b2f36;--muted:#8c7f86;--line:#f0e5e3;--accent:#b4687a;--accent-dark:#9c5568;--accent-soft:#f9ecef;--gold:#c4a574;
  --mk:#c27586;--mk-soft:#fcf0f3;--hr:#76998a;--hr-soft:#eff6f2;--cu:#9a87c2;--cu-soft:#f4f0fb;--ph:#7aa3c2;--ph-soft:#eef5fa;
  --bad:#c24e5d;--bad-soft:#fdeef0;--warn:#a87228;--warn-soft:#fdf5e7;--good:#5f8f71;--good-soft:#eef6f1;
  --display:"Bellefair","Frank Ruhl Libre",Georgia,serif;
  --body:"Assistant","Heebo","Segoe UI",Arial,sans-serif;
  --r:18px;
  --shadow:0 1px 2px rgb(120 80 90 / .05),0 14px 34px -24px rgb(120 80 90 / .4);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 520px at 50% -240px,#f6e1e5 0%,rgb(246 225 229 / 0) 72%),var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{max-width:820px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h1{font-family:var(--display);font-size:clamp(32px,6.4vw,46px);line-height:1.08;letter-spacing:.005em}
h2{font-family:var(--display);font-size:30px;line-height:1.15;margin:40px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-size:13px;color:var(--muted)}
h3{font-weight:600}
p{margin:0}
b{font-weight:600}
.muted{color:var(--muted)}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.06em}
.flourish{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:12px;width:min(260px,70%);margin:10px 0 2px}
.flourish span{flex:1;height:1px;background:linear-gradient(to left,transparent,var(--gold))}
.flourish span:last-child{background:linear-gradient(to right,transparent,var(--gold))}
.center .flourish{margin-inline:auto}
.top{display:grid;gap:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.count{font-family:var(--display);font-size:24px;color:var(--accent);line-height:1}
.times{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14.5px;color:var(--muted)}
.times b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;margin-left:6px;display:inline-block;direction:ltr}
.times li.key b{color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;border-radius:999px;padding:4px 14px;background:rgb(255 255 255 / .7);border:1px solid var(--line);color:var(--muted);justify-self:start}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok{color:var(--good)}.status.ok i{background:var(--good)}
.status.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}.status.bad i{background:var(--bad)}
.status.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}.status.warn i{background:var(--warn)}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:6px;font-size:14.5px;margin-top:18px;box-shadow:var(--shadow)}
.howto b{color:var(--accent)}
/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.nav .hi{font-size:15px;color:var(--muted)}
.nav .hi b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:20px}
.tag-admin{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--accent-soft);color:var(--accent);margin-inline-start:8px;vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:14px;padding:6px 16px;cursor:pointer;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
/* issues */
.issues{border-radius:var(--r);padding:12px 18px;margin-top:16px;font-size:14.5px}
.issues.ok{background:var(--good-soft);color:var(--good)}
.issues.has{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.issues ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.issues li{display:flex;gap:10px;align-items:baseline}
.sev{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px}
.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.issues a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--line)}
/* buttons & inputs */
.btn{appearance:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--bad)}
.btn.small{font-size:13px;padding:4px 12px}
.btn.wide{width:100%;justify-content:center;padding:12px;border-style:dashed;border-color:#e2cfd1;color:var(--muted);background:rgb(255 255 255 / .6)}
.btn.wide:hover{color:var(--accent);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:#fdfafa;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;width:100%}
input[type=time],input[type=number]{font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder{color:var(--muted);opacity:.75}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
input[type=checkbox]:disabled{cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.hint{font-size:12px;color:var(--accent)}
/* table cards */
.tcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow);--k:var(--hr);--ks:var(--hr-soft)}
.tcard.mk{--k:var(--mk);--ks:var(--mk-soft)}
.tcard.hr,.tcard.hc{--k:var(--hr);--ks:var(--hr-soft)}
.tcard.cu{--k:var(--cu);--ks:var(--cu-soft)}
.tcard.ph{--k:var(--ph);--ks:var(--ph-soft)}
.thead{background:linear-gradient(180deg,var(--ks),#fff);border-top:2px solid var(--k);padding:16px 18px;display:grid;gap:12px}
.thead .row1{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;align-items:end}
.thead .row2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;align-items:start}
.thead input,.thead select{background:#fff}
.vname{font-weight:600;font-size:17px}
.ro-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ro-head h3{font-family:var(--display);font-weight:400;font-size:24px}
.ktag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 12px;background:#fff;color:var(--k);border:1px solid var(--k)}
.ro-meta{font-size:14.5px;color:var(--ink)}
.ro-meta span{font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.vnote{font-size:14px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:10px 18px;border-bottom:1px solid var(--line);letter-spacing:.03em}
td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.tm{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;width:1%;direction:ltr;text-align:right;color:var(--ink)}
td.nt{width:1%;white-space:nowrap}
tr.slot.taken td.tm{color:var(--k)}
tr.slot.done td.tm{color:var(--good)}
tr.slot.bad{background:var(--bad-soft)}
tr.slot.warn{background:var(--warn-soft)}
tr.slot.mine-row{box-shadow:inset -3px 0 0 var(--accent)}
select.book{font-weight:600}
select.book.free{color:var(--good)}
select.book.brk{color:var(--muted);font-style:italic}
.st{font-weight:600}
.st.free{color:var(--good);font-weight:500}
.st.brk{color:var(--muted);font-style:italic;font-weight:500}
.take{appearance:none;font:inherit;font-size:14px;font-weight:600;color:var(--good);background:var(--good-soft);border:1px dashed #a9c7b3;border-radius:12px;padding:7px 14px;cursor:pointer;width:100%;text-align:start}
.take:hover{border-style:solid;border-color:var(--good)}
.tname{appearance:none;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 14px;cursor:pointer;width:100%;text-align:start;display:grid;gap:0;line-height:1.35}
.tname small{font-weight:400;color:var(--muted);font-size:12px}
.tname:hover{border-color:var(--accent)}
.tname.me{background:var(--accent-soft);border-color:#e5c3cb}
.wants{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.want{appearance:none;font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 12px;border:1px solid #e5c3cb;background:var(--accent-soft);color:var(--accent);cursor:default}
button.want{cursor:pointer}
button.want:hover{background:#fff}
.btag{display:inline-block;font-size:12px;font-weight:600;color:var(--gold);margin-top:4px;letter-spacing:.02em}
.donebadge{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--good)}
.rmsg{font-size:12.5px;margin-top:4px;font-weight:500}
tr.bad .rmsg{color:var(--bad)}
tr.warn .rmsg{color:var(--warn)}
.nbtn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:13px;border-radius:999px;padding:3px 12px;cursor:pointer;white-space:nowrap}
.nbtn:hover{border-color:var(--accent);color:var(--accent)}
.nbtn.has{color:var(--accent);border-color:#e5c3cb;background:var(--accent-soft)}
tr.notes td{padding-top:0;background:inherit}
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.nlist li{display:flex;gap:8px;align-items:baseline;font-size:14px;background:var(--bg);border-radius:12px;padding:6px 12px}
.nlist li span{flex:1}
.nlist small{color:var(--muted);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nlist button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.nlist button:hover{color:var(--bad)}
.nadd{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.nadd input{flex:1 1 200px}
.empty{padding:18px;color:var(--muted);font-size:14.5px}
.orph{padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--warn);display:grid;gap:6px}
.orph div{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tfoot{display:flex;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--line)}
/* photographer rows */
.prow td input{background:transparent;border-color:transparent;padding:5px 8px}
.prow td input:hover{border-color:var(--line)}
.prow td input:focus{background:#fdfafa}
.prow .tpair{display:flex;align-items:center;gap:4px;direction:ltr;justify-content:flex-end}
.prow .tpair input{width:120px}
/* people admin */
.ptable td{padding:7px 8px}
.ptable th{padding:10px 8px}
.ptable td:first-child,.ptable th:first-child{padding-inline-start:18px}
.ptable input,.ptable select{padding:6px 10px}
.ptable input[type=time]{width:120px}
.table-scroll{overflow-x:auto;position:relative}
.ptable{min-width:760px}
/* person cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:9px;align-content:start;box-shadow:var(--shadow)}
.pcard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard h3{font-family:var(--display);font-weight:400;font-size:22px}
.pcard header small{color:var(--muted);font-size:12.5px}
.pcard .arr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pcard .arr input{width:120px;padding:5px 10px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.ck{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;white-space:nowrap}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.plist li{display:grid;grid-template-columns:100px 1fr;gap:8px}
.plist .t{font-variant-numeric:tabular-nums;font-weight:600;direction:ltr;text-align:right}
.plist li.bad{color:var(--bad)}
.pcard footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
.pcard.none{opacity:.7}
/* mine */
.mine-hero{display:grid;gap:6px;margin-bottom:6px}
.mylist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mylist li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-inline-start:3px solid var(--k);--k:var(--hr);box-shadow:var(--shadow)}
.mylist li.mk{--k:var(--mk)}.mylist li.cu{--k:var(--cu)}.mylist li.ph{--k:var(--ph)}
.mylist li.bad{background:var(--bad-soft)}
.mylist .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;direction:ltr;white-space:nowrap;color:var(--k)}
.mylist .w b{display:block;font-weight:600}
.mylist .w small{display:block;color:var(--muted);font-size:13px}
.mylist .w .rmsg{display:block;color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.panel .row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
/* home */
.home{display:grid;gap:26px;padding-top:6px}
.center{text-align:center;display:grid;gap:4px;justify-items:center}
.home .center h1{font-size:clamp(36px,8vw,54px)}
.lead{font-size:16px;color:var(--muted)}
.gh{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.gh::after{content:"";flex:1;height:1px;background:linear-gradient(to left,transparent,var(--line))}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wgrid.couple{grid-template-columns:1.5fr 1fr}
.who{position:relative;overflow:hidden;border:0;border-radius:22px;min-height:108px;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:start;cursor:pointer;font:inherit;color:#fff;box-shadow:0 1px 2px rgb(60 30 40 / .12),0 14px 30px -18px rgb(60 30 40 / .5);transition:transform .2s ease,box-shadow .2s ease;isolation:isolate}
.who:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgb(60 30 40 / .12),0 20px 36px -18px rgb(60 30 40 / .55)}
.who b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;position:relative;z-index:3}
.who small{font-size:13px;opacity:.9;position:relative;z-index:3;letter-spacing:.02em}
.who::before{content:"";position:absolute;inset:6px;border:1px solid rgb(255 255 255 / .3);border-radius:17px;pointer-events:none;z-index:2}
.who::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,rgb(255 255 255 / .2) 48%,transparent 58%);z-index:1;pointer-events:none}
.who.sel{outline:2px solid var(--accent);outline-offset:4px}
.who.pearl{min-height:160px;color:#3b2f20;background:radial-gradient(130% 100% at 80% 0%,#ffffff 0%,#fdfaf4 30%,#f3ebdf 65%,#e7dcc9 100%);box-shadow:0 1px 2px rgb(120 96 60 / .2),0 18px 34px -18px rgb(120 96 60 / .5),inset 0 0 0 1px #e8dbc0}
.who.pearl::before{border-color:rgb(196 165 116 / .65)}
.who.pearl::after{background:linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .95) 42%,rgb(255 214 236 / .45) 47%,rgb(204 230 255 / .45) 52%,transparent 62%);animation:sheen 5s ease-in-out infinite}
.who.pearl b{font-size:40px}
.who.pearl small{color:#a8864a;font-weight:600;opacity:1}
@keyframes sheen{0%{transform:translateX(-60%)}55%,100%{transform:translateX(60%)}}
.orn{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:72%;max-width:250px;height:auto;z-index:3;pointer-events:none}
.who.tux{min-height:160px;background:linear-gradient(118deg,transparent 46%,rgb(255 255 255 / .08) 50%,transparent 56%),linear-gradient(62deg,transparent 46%,rgb(255 255 255 / .05) 50%,transparent 56%),linear-gradient(150deg,#2c2c33 0%,#17171b 55%,#0b0b0d 100%)}
.who.tux::before{border-color:rgb(196 165 116 / .45)}
.bow{position:absolute;top:18px;left:18px;width:46px;z-index:3}
.who.gown{background:linear-gradient(155deg,#5a0c22 0%,#8e1736 40%,#b02a48 52%,#801331 66%,#4f0a1d 100%)}
.who.royal{background:linear-gradient(155deg,#10237a 0%,#2144b8 44%,#3361dc 54%,#1b3796 70%,#0f2070 100%)}
.who.emerald{background:linear-gradient(155deg,#0d4431 0%,#1a6e4f 44%,#259466 54%,#155c40 70%,#0c3d2b 100%)}
.who.sky{color:#0d3a55;background:linear-gradient(155deg,#a7dbf5 0%,#cdeefd 44%,#e8f8ff 54%,#bce5f9 70%,#9cd4f1 100%)}
.who.sky::before{border-color:rgb(255 255 255 / .7)}
.who.sky::after{background:linear-gradient(115deg,transparent 38%,rgb(255 255 255 / .55) 48%,transparent 58%)}
/* choose */
.choose{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:30px}
.choose .opts{display:grid;gap:14px;width:min(420px,100%);margin-top:12px}
.bigbtn{appearance:none;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 24px;cursor:pointer;text-align:start;display:grid;gap:2px;box-shadow:var(--shadow);transition:transform .2s ease}
.bigbtn b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.bigbtn small{color:var(--muted);font-size:14px}
.bigbtn.primary{background:linear-gradient(135deg,#c27a8b,var(--accent) 60%,#a65a6d);border-color:transparent;color:#fff}
.bigbtn.primary small{color:inherit;opacity:.9}
.bigbtn:hover{transform:translateY(-2px)}
.linkbtn{appearance:none;border:0;background:none;font:inherit;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;cursor:pointer;font-size:14px}
.linkbtn:hover{color:var(--accent)}
/* pin */
.scrim{position:fixed;inset:0;background:rgb(59 47 54 / .35);backdrop-filter:blur(3px);z-index:50}
.pinbox{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));background:var(--surface);border-radius:24px;padding:24px;display:grid;gap:12px;text-align:center;box-shadow:0 30px 60px -20px rgb(60 30 40 / .45)}
.pinbox h3{font-family:var(--display);font-weight:400;font-size:28px}

<script>
(function(){

/* ===== הגדרות ===== */

const GROUPS = { bride: "כלה", girl: "בנות", mom: "אמהות" };

const SEED = {

    maayan: { name: "מעין סעדון",    kind: "makeup", from: "10:00", to: "17:00", dur: 45, gap: 10, note: "לפי שקד: עדית ושלומית, מגיעות 13:30", order: 3 },

    vicky2: { name: "העוזרת של ויקי", kind: "hair",   from: "10:00", to: "17:00", dur: 45, gap: 10, note: "", order: 5 },
    chen:   { name: "חן שקד",        kind: "curls",  from: "10:00", to: "17:00", dur: 45, gap: 10, note: "לפי שקד: אגם, ענבר, חני. עדי – בבדיקה", order: 6 }
  }
};

/* ===== מצב ===== */
let DATA = null;
let mode = "connecting"; // live | poll | local | denied | offline
let es = null, pollTimer = null, retryTimer = null;
let ME = null;
try { ME = localStorage.getItem(ME_KEY) || null; } catch (e) {}
let pinOk = false;
try { pinOk = localStorage.getItem(PIN_KEY) === PIN_HASH; } catch (e) {}
const ui = { screen: ME ? "choose" : "home", openNotes: new Set(), pinFor: null, pinErr: false };
function fnv(s){ let h = 0x811c9dc5; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
const app = document.getElementById("app");

/* ===== עזרים ===== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function toMin(t){ if (!t || !/^\d{1,2}:\d{2}/.test(t)) return null; const p = t.split(":"); return (+p[0]) * 60 + (+p[1]); }
function toT(m){ m = Math.max(0, Math.min(1439, m)); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
const rng = (a, b) => "\u2066" + toT(a) + "–" + toT(b) + "\u2069";
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function ordered(o){ return Object.entries(o || {}).filter(([, v]) => v && typeof v === "object").sort((x, y) => (x[1].order || 0) - (y[1].order || 0) || (x[0] < y[0] ? -1 : 1)); }
function getIn(o, parts){ for (const p of parts) { if (o == null) return undefined; o = o[p]; } return o; }
function setIn(o, parts, val){
  if (!parts.length) return val == null ? {} : val;
  o = o || {}; let cur = o;
  for (let i = 0; i < parts.length - 1; i++) { if (cur[parts[i]] == null || typeof cur[parts[i]] !== "object") cur[parts[i]] = {}; cur = cur[parts[i]]; }
  const last = parts[parts.length - 1];
  if (val == null) delete cur[last]; else cur[last] = val;
  return o;
}
function nextOrder(o){ return ordered(o).reduce((m, [, v]) => Math.max(m, v.order || 0), 0) + 1; }
function daysLeft(){ const n = new Date(); return Math.round((WEDDING - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000); }
const plural = (n, one, many) => n === 1 ? one : n + " " + many;
const info = () => DATA.info || {};
const photographer = () => info().photographer || "אלכס";

function pgroup(id, p){ if (p && GROUPS[p.group]) return p.group; if (id === "shaked" || (p && p.role === "כלה")) return "bride"; if (p && /^(אם|אמא)/.test(p.role || "")) return "mom"; return "girl"; }
function isBridePid(pid){ const p = (DATA.people || {})[pid]; return !!p && pgroup(pid, p) === "bride"; }
function personName(id){ if (id === BREAK) return "הפסקה"; const p = DATA.people && DATA.people[id]; return p ? (p.name || "ללא שם") : "שם שנמחק"; }
function vkind(v){ if (v.kind === "hair" && /תלתל/.test(v.role || "")) return "curls"; if (KINDS[v.kind]) return v.kind; return /תלתל/.test(v.role || "") ? "curls" : /שיער|ספר/.test(v.role || "") ? "hair" : "makeup"; }
function vendorWhat(v){ return KINDS[vkind(v)].short + " אצל " + (v.name || "ספקית ללא שם"); }
function stdDur(v){ const d = Number(v.dur); return d >= 5 ? d : 45; }
function gapOf(v){ const g = Number(v.gap); return v.gap === "" || v.gap == null || !(g >= 0) ? DEFAULT_GAP : Math.min(60, g); }

/* ===== זהות והרשאות ===== */
function meParse(){ if (!ME) return null; const i = ME.indexOf(":"); return { t: ME.slice(0, i), id: ME.slice(i + 1) }; }
function meValid(){ const m = meParse(); if (!m || !DATA) return false; if (m.t === "p") return !!(DATA.people || {})[m.id]; if (m.t === "v") return !!(DATA.vendors || {})[m.id]; return m.t === "g" || m.t === "ph"; }
function needsPin(code){ if (!code) return false; const i = code.indexOf(":"), t = code.slice(0, i), id = code.slice(i + 1); return t === "g" || (t === "p" && isBridePid(id)); }
function isAdmin(){ return !!ME && needsPin(ME) && pinOk; }
function myPid(){ const m = meParse(); return m && m.t === "p" ? m.id : null; }
function myVid(){ const m = meParse(); return m && m.t === "v" ? m.id : null; }
function isPhotographer(){ const m = meParse(); return !!m && m.t === "ph"; }
function whoName(code){
  if (!code) return ""; const i = code.indexOf(":"), t = code.slice(0, i), id = code.slice(i + 1);
  if (t === "p") return personName(id); if (t === "v") return ((DATA.vendors || {})[id] || {}).name || "ספקית"; if (t === "g") return "איל"; if (t === "ph") return photographer(); return "";
}
function canPath(path){
  const ps = path.split("/");
  if (isAdmin()) return true;
  if (ps[0] === "vendors") return myVid() === ps[1];
  if (ps[0] === "photo") return isPhotographer();
  if (ps[0] === "people") return myPid() === ps[1] && ["arrive", "doneMakeup", "doneHair"].includes(ps[2]);
  return false;
}

/* ===== תורים: נבנים מהשעות, תור כלה = שעתיים והתורים שאחריו זזים ===== */
function slotsOf(vid, v, bkOverride){
  const a = toMin(v.from), b = toMin(v.to), d = Number(v.dur);
  if (a == null || b == null || !(d >= 5) || b <= a) return [];
  const bk = bkOverride || ((DATA.book || {})[vid] || {}), out = [], gap = gapOf(v); let t = a;
  for (let i = 0; i < 120; i++) {
    const key = "s" + i, pid = bk[key] || "", bride = !!pid && pid !== BREAK && isBridePid(pid), len = bride ? BRIDE_DUR : d;
    if (t + len > b) break;
    out.push({ key, i, start: t, end: t + len, pid, bride });
    t += len + gap;
  }
  return out;
}

/* ===== ניתוח: התנגשויות ===== */
function analyze(){
  const issues = [], flags = {}, runsBy = {}, orphans = {};
  function flag(keys, vid, sev, msg){ keys.forEach(k => { const id = vid + "|" + k; if (!flags[id] || flags[id].sev !== "bad") flags[id] = { sev, msg }; }); }
  ordered(DATA.vendors).forEach(([vid, v]) => {
    const slots = slotsOf(vid, v), bk = (DATA.book || {})[vid] || {}, keys = new Set(slots.map(s => s.key));
    let run = null;
    const close = () => { if (run) (runsBy[run.pid] = runsBy[run.pid] || []).push(run); run = null; };
    slots.forEach(s => {
      const pid = s.pid;
      if (pid && pid !== BREAK) {
        if (run && run.pid === pid && s.start - run.end <= gapOf(v)) { run.end = s.end; run.keys.push(s.key); }
        else { close(); run = { pid, vid, v, start: s.start, end: s.end, keys: [s.key] }; }
      } else close();
    });
    close();
    const orph = Object.keys(bk).filter(k => !keys.has(k) && bk[k]);
    if (orph.length) {
      orphans[vid] = orph;
      orph.forEach(k => { if (bk[k] !== BREAK) issues.push({ sev: "warn", vid, pid: bk[k], text: (v.name || "ספקית") + ": התור של " + personName(bk[k]) + " כבר לא נכנס בשעות העבודה" }); });
    }
  });
  Object.entries(runsBy).forEach(([pid, runs]) => {
    const p = (DATA.people || {})[pid] || {}, name = personName(pid);
    runs.sort((x, y) => x.start - y.start);
    for (let i = 0; i < runs.length; i++) for (let j = i + 1; j < runs.length; j++) {
      const x = runs[i], y = runs[j];
      if (x.vid !== y.vid && x.start < y.end && y.start < x.end) {
        issues.push({ sev: "bad", vid: x.vid, pid, text: name + ": " + vendorWhat(x.v) + " (" + rng(x.start, x.end) + ") באותו זמן כמו " + vendorWhat(y.v) + " (" + rng(y.start, y.end) + ")" });
        flag(x.keys, x.vid, "bad", "חופף ל" + vendorWhat(y.v) + " " + rng(y.start, y.end));
        flag(y.keys, y.vid, "bad", "חופף ל" + vendorWhat(x.v) + " " + rng(x.start, x.end));
      }
    }
    const arr = toMin(p.arrive), rdy = toMin(p.readyBy);
    runs.forEach(r => {
      if (arr != null && r.start < arr) { issues.push({ sev: "bad", vid: r.vid, pid, text: name + ": " + vendorWhat(r.v) + " ב־" + toT(r.start) + ", אבל היא מגיעה רק ב־" + p.arrive }); flag(r.keys, r.vid, "bad", "מגיעה רק ב־" + p.arrive); }
      if (rdy != null && r.end > rdy) { issues.push({ sev: "bad", vid: r.vid, pid, text: name + ": " + vendorWhat(r.v) + " נגמר ב־" + toT(r.end) + ", אבל היא צריכה להיות מוכנה עד " + p.readyBy }); flag(r.keys, r.vid, "bad", "צריכה להיות מוכנה עד " + p.readyBy); }
    });
    if (arr != null && runs.length) {
      const g0 = runs[0].start - arr;
      if (g0 > 30) { issues.push({ sev: "warn", vid: runs[0].vid, pid, text: name + ": מגיעה ב־" + p.arrive + " ומחכה " + g0 + " דק׳ עד התור הראשון" }); flag(runs[0].keys, runs[0].vid, "warn", "המתנה של " + g0 + " דק׳ מההגעה"); }
      for (let k = 1; k < runs.length; k++) { const g = runs[k].start - runs[k - 1].end; if (g > 30) { issues.push({ sev: "warn", vid: runs[k].vid, pid, text: name + ": מחכה " + g + " דק׳ בין התורים" }); flag(runs[k].keys, runs[k].vid, "warn", "המתנה של " + g + " דק׳ מהתור הקודם"); } }
    }
  });
  issues.sort((x, y) => (x.sev === "bad" ? 0 : 1) - (y.sev === "bad" ? 0 : 1));
  return { issues, flags, runsBy, orphans };
}

/* ===== תצוגה משותפת ===== */

    connecting: ["", "מתחבר…"],

    poll: ["ok", "מחובר · מתעדכן כל כמה שניות"],
    local: ["warn", "מצב מקומי: השינויים נשמרים רק במכשיר הזה"],
    denied: ["bad", "אין הרשאה למסד הנתונים (צריך לעדכן את הכללים ב־Firebase). השינויים נשמרים רק במכשיר הזה"],
    offline: ["bad", "אין חיבור. שינויים שתעשו עכשיו לא יישמרו – מנסה להתחבר שוב…"]

  return '<span class="status ' + m[0] + '" role="status"><i></i>' + m[1] + "</span>";

function countdown(){ const d = daysLeft(); return d > 1 ? "עוד " + d + " ימים" : d === 1 ? "מחר!" : d === 0 ? "היום!" : ""; }
function timesHTML(){

  t += ph.map(r => { const dur = toMin(r.end) - toMin(r.start); return "<li><b>" + esc(dur > 0 && dur <= 15 ? r.start : r.start + "–" + r.end) + "</b>" + esc(r.label || "") + "</li>"; }).join("");
  if (info().leave) t += "<li><b>" + esc(info().leave) + "</b>יציאה לאולם</li>";
  if (info().reception) t += "<li><b>" + esc(info().reception) + "</b>קבלת פנים</li>";
  return '<ul class="times">' + t + "</ul>";
}
function header(){

    (cd ? '<div class="count">' + cd + "</div>" : "") + "</div>" + timesHTML() + statusHTML() + "</header>";
}
function navHTML(){
  return '<nav class="nav"><span class="hi">שלום, <b>' + esc(whoName(ME)) + "</b>" + (isAdmin() ? '<span class="tag-admin">יכול/ה לשנות הכול</span>' : "") + "</span>" +
    '<div class="seg" role="group" aria-label="תצוגה"><button type="button" data-act="screen" data-s="mine" aria-pressed="' + (ui.screen === "mine") + '">הלו״ז שלי</button><button type="button" data-act="screen" data-s="full" aria-pressed="' + (ui.screen === "full") + '">הלו״ז המלא</button></div>' +
    '<button type="button" class="linkbtn" data-act="home">החלפת משתמש</button></nav>';
}
function issuesHTML(list){
  if (!list.length) return '<div class="issues ok"><b>אין התנגשויות.</b> אף אחת לא משובצת לשני טיפולים באותו זמן.</div>';
  return '<div class="issues has"><ul>' + list.map(it => '<li><span class="sev ' + (it.sev === "bad" ? "s-bad" : "s-warn") + '">' + (it.sev === "bad" ? "התנגשות" : "לתשומת לב") + '</span><a href="#v-' + esc(it.vid) + '" data-act="goto" data-v="' + esc(it.vid) + '">' + esc(it.text) + "</a></li>").join("") + "</ul></div>";
}

/* ===== מסך בית ===== */
const BOW = '<svg class="bow" viewBox="0 0 48 20" aria-hidden="true"><path d="M3 3 Q12 7 21 8 Q12 13 3 17 Q1 10 3 3Z M45 3 Q36 7 27 8 Q36 13 45 17 Q47 10 45 3Z" fill="#f2f2f5" opacity=".92"/><rect x="20" y="6" width="8" height="8" rx="2" fill="#ffffff"/></svg>';
function pearls(){
  let c = ""; const n = 13;
  for (let i = 0; i < n; i++) { const x = 12 + i * (196 / (n - 1)), u = (x - 110) / 100, y = 6 + 14 * (1 - u * u), r = i === 6 ? 6.2 : 4.6 + 0.9 * (1 - Math.abs(u)); c += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="url(#pg)" stroke="#d8c9ad" stroke-width=".5"/>'; }
  return '<svg class="orn" viewBox="0 0 220 30" aria-hidden="true"><defs><radialGradient id="pg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f6f0e6"/><stop offset="1" stop-color="#cdbfa6"/></radialGradient></defs><path d="M12 6 Q110 46 208 6" fill="none" stroke="#cdb98f" stroke-width=".8"/>' + c + "</svg>";
}
function homeHTML(){
  const cd = countdown();
  const card = (code, cls, name, sub, extra) => '<button type="button" class="who ' + cls + (ME === code ? " sel" : "") + '" data-act="iam" data-me="' + esc(code) + '">' + (extra || "") + "<b>" + esc(name) + "</b><small>" + esc(sub) + "</small></button>";
  const ppl = ordered(DATA.people);
  const brides = ppl.filter(([id, p]) => pgroup(id, p) === "bride"), girls = ppl.filter(([id, p]) => pgroup(id, p) === "girl"), moms = ppl.filter(([id, p]) => pgroup(id, p) === "mom");

      ((isAdmin() || myPid() === pid) ? '<button type="button" class="btn small" data-act="release-run" data-v="' + r.vid + '" data-ks="' + r.keys.join(",") + '">ביטול</button>' : "<span></span>") + "</li>";
  }).join("") + "</ul>";
}
function mineHTML(a){
  const m = meParse(), top = '<header class="top mine-hero"><p class="eyebrow">' + esc(info().date || "") + "</p><h1>הלו״ז של " + esc(whoName(ME)) + "</h1>" + statusHTML() + "</header>";
  if (m.t === "p") {
    const p = DATA.people[m.id], pp = "people/" + m.id + "/", bride = pgroup(m.id, p) === "bride";
    const mine = a.issues.filter(i => i.pid === m.id);
    const wants = [];
    Object.entries(DATA.want || {}).forEach(([vid, sm]) => Object.entries(sm || {}).forEach(([k, ws]) => { if (ws && ws[m.id] && DATA.vendors[vid]) { const s = slotsOf(vid, DATA.vendors[vid]).find(x => x.key === k); wants.push({ vid, k, s }); } }));
    const runs = a.runsBy[m.id] || [], last = runs.length ? Math.max.apply(null, runs.map(r => r.end)) : null;
    return top +
      '<div class="panel" style="margin-top:16px"><div class="row"><label class="arr ck" for="me-arr">שעת הגעה <input type="time" step="300" id="me-arr" data-path="' + pp + 'arrive" value="' + esc(p.arrive) + '" style="width:120px"></label>' +
      '<span class="muted">' + (p.readyBy ? "צריכה להיות מוכנה עד <b>" + esc(p.readyBy) + "</b>" : "") + (last != null ? " · לפי התורים מוכנה ב־<b>" + toT(last) + "</b>" : "") + "</span></div>" +
      '<div class="checks"><label class="ck"><input type="checkbox" id="me-dm" data-path="' + pp + 'doneMakeup"' + (p.doneMakeup ? " checked" : "") + '>סיימתי איפור</label><label class="ck"><input type="checkbox" id="me-dh" data-path="' + pp + 'doneHair"' + (p.doneHair ? " checked" : "") + ">סיימתי שיער</label></div></div>" +
      "<h2>התורים שלי</h2>" + myRunsHTML(m.id, a) + (mine.length ? issuesHTML(mine) : "") +
      (wants.length ? '<h2>תורים שסימנתי שאני מעוניינת בהם</h2><ul class="mylist">' + wants.map(w => { const v = DATA.vendors[w.vid], k = vkind(v), holder = ((DATA.book || {})[w.vid] || {})[w.k];
          return '<li class="' + KINDS[k].cls + '"><span class="t">' + (w.s ? rng(w.s.start, w.s.end) : "—") + '</span><span class="w"><b>' + esc(vendorWhat(v)) + "</b><small>" + (holder && holder !== BREAK ? "התור אצל " + esc(personName(holder)) : "התור התפנה – אפשר לתפוס אותו") + '</small></span><button type="button" class="btn small" data-act="unwant" data-v="' + w.vid + '" data-k="' + w.k + '" data-p="' + m.id + '">הסרה</button></li>'; }).join("") + "</ul>" : "") +
      (bride ? photoHTML() : "") +
      '<p style="margin-top:22px"><button type="button" class="btn primary" data-act="screen" data-s="full">לתפיסת תורים – הלו״ז המלא</button></p>';
  }
  if (m.t === "v") return top + issuesHTML(a.issues.filter(i => i.vid === m.id)) + '<div style="margin-top:16px"></div>' + vendorHTML(m.id, DATA.vendors[m.id], a);
  const bride = ordered(DATA.people).find(([id, p]) => pgroup(id, p) === "bride");
  return top + '<div style="margin-top:16px">' + timesHTML() + "</div>" + photoHTML() +
    (bride ? "<h2>הלו״ז של " + esc(bride[1].name) + "</h2>" + myRunsHTML(bride[0], a) : "") +
    (m.t === "g" ? "<h2>התנגשויות</h2>" + issuesHTML(a.issues) : "");
}

function view(){
  if (!DATA) return "";
  if (!ME || !meValid() || (needsPin(ME) && !pinOk) || ui.screen === "home") return homeHTML();
  if (ui.screen === "choose") return chooseHTML();
  const a = analyze();
  return navHTML() + (ui.screen === "mine" ? mineHTML(a) : fullHTML(a));
}

/* ===== רינדור עם שמירת פוקוס ===== */
let rq = false;
function scheduleRender(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render(){
  if (!DATA) return;
  const ae = document.activeElement; let keep = null;
  if (ae && ae.id && app.contains(ae)) { keep = { id: ae.id, value: ae.value, dirty: ae.dataset && ae.dataset.dirty === "1" }; try { keep.s = ae.selectionStart; keep.e = ae.selectionEnd; } catch (e) {} }
  app.innerHTML = view();
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { if (keep.dirty) { el.value = keep.value; el.dataset.dirty = "1"; } try { el.focus({ preventScroll: true }); if (keep.s != null && el.setSelectionRange) el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  }
}

/* ===== מסד נתונים (Firebase Realtime Database דרך REST) ===== */
const url = path => DB_URL.replace(/\/+$/, "") + "/" + ROOT + (path ? "/" + path : "") + ".json";
function setMode(m){ if (mode === m) return; mode = m; app.querySelectorAll(".status").forEach(s => { s.outerHTML = statusHTML(); }); }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(DATA)); } catch (e) {} }
function loadLocal(){ try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (d) return d; } catch (e) {} return clone(SEED); }
async function write(path, val){
  DATA = setIn(DATA, path.split("/"), val == null ? null : clone(val));
  scheduleRender();
  if (mode === "local" || mode === "denied") { saveLocal(); return; }
  if (mode === "offline") return;
  try {
    const r = await fetch(url(path), val == null ? { method: "DELETE" } : { method: "PUT", body: JSON.stringify(val) });
    if (r.status === 401 || r.status === 403) { goDenied(); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (e) { goOffline(); }
}
function goDenied(){ setMode("denied"); stopSync(); saveLocal(); render(); }
function goOffline(){ if (mode === "offline") return; setMode("offline"); stopSync(); render(); clearTimeout(retryTimer); retryTimer = setTimeout(connect, 8000); }
function stopSync(){ try { es && es.close(); } catch (e) {} es = null; clearInterval(pollTimer); pollTimer = null; }
async function fetchAll(){
  const r = await fetch(url(""), { cache: "no-store" });
  if (r.status === 401 || r.status === 403) { const err = new Error("denied"); err.denied = true; throw err; }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function migrate(d){
  // נתונים שנוצרו בגרסה הקודמת: משלימים שדות חדשים בלי לגעת במה שהוזן
  const fixes = [];
  if (!d.info) d.info = {};
  if (!d.info.photographer) fixes.push(["info/photographer", "אלכס"]);
  if (!d.info.hoursDefaulted) { fixes.push(["info/hoursDefaulted", true]); Object.entries(d.vendors || {}).forEach(([id, v]) => { if (!v) return; if (!v.from) fixes.push(["vendors/" + id + "/from", "10:00"]); if (!v.to) fixes.push(["vendors/" + id + "/to", "17:00"]); }); }
  Object.entries(d.people || {}).forEach(([id, p]) => { if (p && !GROUPS[p.group]) fixes.push(["people/" + id + "/group", pgroupRaw(id, p)]); });
  Object.entries(d.vendors || {}).forEach(([id, v]) => { if (!v) return; if (v.role !== undefined || !KINDS[v.kind]) { fixes.push(["vendors/" + id + "/kind", vkind(v)]); fixes.push(["vendors/" + id + "/role", null]); } if (v.dur === "" || v.dur == null) fixes.push(["vendors/" + id + "/dur", 45]); });
  if (!fixes.length) return;
  fixes.forEach(([p, v]) => { d = setIn(d, p.split("/"), v); });
  DATA = d;
  for (const [p, v] of fixes) { try { await fetch(url(p), v == null ? { method: "DELETE" } : { method: "PUT", body: JSON.stringify(v) }); } catch (e) {} }
}
function pgroupRaw(id, p){ if (id === "shaked" || p.role === "כלה") return "bride"; if (/^(אם|אמא)/.test(p.role || "")) return "mom"; return "girl"; }
async function connect(){
  clearTimeout(retryTimer);
  if (!DB_URL) { DATA = loadLocal(); setMode("local"); render(); return; }
  try {
    let d = await fetchAll();
    if (d == null) { d = clone(SEED); await fetch(url(""), { method: "PUT", body: JSON.stringify(d) }); }
    DATA = d; await migrate(DATA); setMode("poll"); render(); openStream();
  } catch (e) {
    if (e.denied) { DATA = loadLocal(); goDenied(); return; }
    if (!DATA) DATA = clone(SEED);
    mode = "connecting"; goOffline();
  }
}
function applyRemote(path, data, isPatch){
  const parts = String(path || "/").split("/").filter(Boolean);
  if (isPatch) Object.keys(data || {}).forEach(k => { DATA = setIn(DATA, parts.concat(k.split("/").filter(Boolean)), data[k]); });
  else if (!parts.length) DATA = data || clone(SEED);
  else DATA = setIn(DATA, parts, data);
  scheduleRender();
}
function openStream(){
  startPolling();
  if (!("EventSource" in window)) return;
  try { es && es.close(); } catch (e) {}
  es = new EventSource(url(""));
  es.addEventListener("put", ev => { try { const m = JSON.parse(ev.data); applyRemote(m.path, m.data, false); setMode("live"); } catch (e) {} });
  es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); applyRemote(m.path, m.data, true); } catch (e) {} });
  es.addEventListener("cancel", () => { goDenied(); });
  es.onerror = () => { if (mode === "live") setMode("poll"); };
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (mode === "live" || document.hidden) return;
    try { const d = await fetchAll(); if (d) { DATA = d; setMode("poll"); scheduleRender(); } }
    catch (e) { if (e.denied) goDenied(); else goOffline(); }
  }, 8000);
}

/* ===== פעולות ===== */
function clashesFor(pid, vid, key, bkOverride){
  const v = DATA.vendors[vid], s = slotsOf(vid, v, bkOverride).find(x => x.key === key); if (!s) return [];
  const out = [];
  ordered(DATA.vendors).forEach(([ovid, ov]) => { if (ovid === vid) return; slotsOf(ovid, ov).forEach(os => { if (os.pid === pid && os.start < s.end && s.start < os.end) out.push(vendorWhat(ov) + " " + rng(os.start, os.end)); }); });
  return out;
}
function laterBooked(vid, key){ const i = +key.slice(1), bk = (DATA.book || {})[vid] || {}; return Object.keys(bk).filter(k => +k.slice(1) > i && bk[k] && bk[k] !== BREAK).length; }
async function freshSlot(vid, key){
  if (!(mode === "live" || mode === "poll")) return undefined;
  try { const r = await fetch(url("book/" + vid + "/" + key), { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) {}
  return undefined;
}
async function onAdminBook(sel){
  const vid = sel.dataset.v, k = sel.dataset.k, val = sel.value, cur = getIn(DATA, ["book", vid, k]) || "";
  if (val === cur) return;
  if (cur && !confirm(val ? "התור תפוס על ידי " + personName(cur) + ". להחליף ל" + (val === BREAK ? "הפסקה" : personName(val)) + "?" : "לפנות את התור של " + personName(cur) + "?")) { sel.value = cur; return; }
  if (val && val !== BREAK) {
    const bk = Object.assign({}, (DATA.book || {})[vid] || {}); bk[k] = val;
    const clash = clashesFor(val, vid, k, bk);
    if (clash.length && !confirm(personName(val) + " כבר בתור באותה שעה:\n" + clash.join("\n") + "\n\nלשבץ בכל זאת? (התור יסומן באדום)")) { sel.value = cur; return; }
    const shift = (isBridePid(val) !== (cur && cur !== BREAK && isBridePid(cur))) ? laterBooked(vid, k) : 0;
    if (shift && !confirm("תור כלה נמשך שעתיים, ולכן " + plural(shift, "התור שאחריו יזוז", "התורים שאחריו יזוזו") + " בהתאם. להמשיך?")) { sel.value = cur; return; }
    if (getIn(DATA, ["want", vid, k, val])) write("want/" + vid + "/" + k + "/" + val, null);
  }
  write("book/" + vid + "/" + k, val || null);
}
async function take(vid, k){
  const me = myPid(); if (!me) return;
  const now = await freshSlot(vid, k);
  if (now) { DATA = setIn(DATA, ["book", vid, k], now); render(); alert("התור נתפס הרגע (" + personName(now) + "). אפשר לבחור תור אחר או ללחוץ על השם כדי לסמן שאת מעוניינת."); return; }
  const bk = Object.assign({}, (DATA.book || {})[vid] || {}); bk[k] = me;
  const clash = clashesFor(me, vid, k, bk);
  if (clash.length && !confirm("כבר יש לך תור באותה שעה:\n" + clash.join("\n") + "\n\nלתפוס בכל זאת? (התור יסומן באדום)")) return;
  if (getIn(DATA, ["want", vid, k, me])) write("want/" + vid + "/" + k + "/" + me, null);
  write("book/" + vid + "/" + k, me);
}
function onField(t){
  const path = t.dataset.path; if (!canPath(path)) { render(); return; }
  let val = t.type === "checkbox" ? t.checked : t.value;
  if (t.type === "number") val = /\/gap$/.test(path) ? (val === "" ? DEFAULT_GAP : Math.max(0, Math.min(60, Math.round(Number(val)) || 0))) : (val === "" ? 45 : Math.max(5, Math.min(240, Math.round(Number(val)) || 45)));
  if (typeof val === "string") val = val.trim();
  delete t.dataset.dirty;
  const cur = getIn(DATA, path.split("/"));
  if (cur === val) return;
  if (/^vendors\/[^/]+\/(from|to|dur|gap)$/.test(path)) {
    const vid = path.split("/")[1], bk = (DATA.book || {})[vid] || {};
    const nv = Object.assign({}, DATA.vendors[vid]); nv[path.split("/")[2]] = val;
    const keys = new Set(slotsOf(vid, nv).map(s => s.key)), lost = Object.keys(bk).filter(k => bk[k] && bk[k] !== BREAK && !keys.has(k));
    if (lost.length && !confirm("אחרי השינוי " + plural(lost.length, "תור תפוס אחד", "תורים תפוסים") + " (" + lost.map(k => personName(bk[k])).join(", ") + ") כבר לא " + (lost.length === 1 ? "ייכנס" : "ייכנסו") + " בשעות העבודה.\n\nלהמשיך?")) { t.value = cur == null ? "" : cur; return; }
  }
  write(path, val);
  if (/^vendors\/[^/]+\/kind$/.test(path)) write(path.replace(/kind$/, "role"), null);
}
function saveNote(rk){
  const [vid, k] = rk.split("|"), inp = document.getElementById("ni-" + vid + "-" + k);
  const text = inp && inp.value.trim(); if (!text) { inp && inp.focus(); return; }
  inp.value = ""; delete inp.dataset.dirty;
  ui.openNotes.delete(rk);
  write("notes2/" + vid + "/" + k + "/" + uid("n"), { text: text.slice(0, 300), at: Date.now(), by: ME });
}
function setScreen(s){ ui.screen = s; try { sessionStorage.setItem("weddingPrep-screen", s); } catch (e) {} render(); window.scrollTo(0, 0); }

app.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("select.book")) { if (isAdmin()) onAdminBook(t); else render(); }
  else if (t.dataset.path) onField(t);
});
app.addEventListener("input", e => { const t = e.target; if (t.dataset && (t.dataset.path || t.dataset.note)) t.dataset.dirty = "1"; });
app.addEventListener("keydown", e => {
  const t = e.target;
  if (t.id === "pin-in" && e.key === "Enter") { e.preventDefault(); pinSubmit(); return; }
  if (t.id === "pin-in" && e.key === "Escape") { ui.pinFor = null; render(); return; }
  if (e.key === "Enter" && t.dataset && t.dataset.note) { e.preventDefault(); saveNote(t.dataset.note); }
  else if (e.key === "Escape" && t.dataset && t.dataset.note) { ui.openNotes.delete(t.dataset.note); render(); }
  else if (e.key === "Enter" && t.dataset && t.dataset.path && t.tagName === "INPUT") { t.blur(); }
});
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const d = b.dataset, me = myPid();
  switch (d.act) {
    case "iam":
      if (needsPin(d.me) && !pinOk) { ui.pinFor = d.me; ui.pinErr = false; render(); setTimeout(() => { const el = document.getElementById("pin-in"); if (el) el.focus(); }, 0); break; }
      if (!needsPin(d.me)) { pinOk = false; try { localStorage.removeItem(PIN_KEY); } catch (err) {} }
      ME = d.me; try { localStorage.setItem(ME_KEY, ME); } catch (err) {} setScreen("choose"); break;
    case "pin-ok": pinSubmit(); break;
    case "pin-cancel": ui.pinFor = null; ui.pinErr = false; render(); break;
    case "home": setScreen("home"); break;
    case "screen": setScreen(d.s); break;
    case "goto": e.preventDefault(); if (ui.screen !== "full") { ui.screen = "full"; render(); } requestAnimationFrame(() => { const el = document.getElementById("v-" + d.v); if (el) el.scrollIntoView({ block: "start" }); }); break;
    case "take": take(d.v, d.k); break;
    case "release": if (me && getIn(DATA, ["book", d.v, d.k]) === me && confirm("לבטל את התור שלך?")) write("book/" + d.v + "/" + d.k, null); break;
    case "release-run": {
      const ks = d.ks.split(","), owner = getIn(DATA, ["book", d.v, ks[0]]);
      if (!(isAdmin() || owner === me)) return;
      if (confirm("לבטל את התור?")) ks.forEach(k => { if (getIn(DATA, ["book", d.v, k]) === owner) write("book/" + d.v + "/" + k, null); });
      break;
    }
    case "want": if (me) { const has = getIn(DATA, ["want", d.v, d.k, me]); write("want/" + d.v + "/" + d.k + "/" + me, has ? null : Date.now()); } break;
    case "unwant": if (isAdmin() || d.p === me) write("want/" + d.v + "/" + d.k + "/" + d.p, null); break;
    case "break": if (myVid() === d.v && !getIn(DATA, ["book", d.v, d.k])) write("book/" + d.v + "/" + d.k, BREAK); break;
    case "unbreak": if ((myVid() === d.v || isAdmin()) && getIn(DATA, ["book", d.v, d.k]) === BREAK) write("book/" + d.v + "/" + d.k, null); break;
    case "toggle-notes": {
      if (ui.openNotes.has(d.rk)) ui.openNotes.delete(d.rk); else ui.openNotes.add(d.rk);
      render();
      if (ui.openNotes.has(d.rk)) { const [vid, k] = d.rk.split("|"); const el = document.getElementById("ni-" + vid + "-" + k); if (el) el.focus(); }
      break;
    }
    case "save-note": saveNote(d.rk); break;
    case "close-note": ui.openNotes.delete(d.rk); render(); break;
    case "del-note": { const n = getIn(DATA, ["notes2", d.v, d.k, d.n]); if (n && (isAdmin() || n.by === ME) && confirm("למחוק את ההערה?")) write("notes2/" + d.v + "/" + d.k + "/" + d.n, null); break; }
    case "clear-orphan": if (isAdmin() || getIn(DATA, ["book", d.v, d.k]) === me) write("book/" + d.v + "/" + d.k, null); break;
    case "add-photo": if (isAdmin() || isPhotographer()) write("photo/" + uid("r"), { start: "", end: "", label: "", order: nextOrder(DATA.photo) }); break;
    case "del-photo": if ((isAdmin() || isPhotographer()) && confirm("למחוק את השורה?")) write("photo/" + d.id, null); break;
    case "add-vendor": {
      if (!isAdmin()) return;
      const id = uid("v");
      await write("vendors/" + id, { name: "", kind: "makeup", from: "10:00", to: "17:00", dur: 45, gap: 10, note: "", order: nextOrder(DATA.vendors) });
      requestAnimationFrame(() => { const el = document.getElementById("v-" + id + "-name"); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } });
      break;
    }
    case "del-vendor": {
      if (!isAdmin()) return;
      const v = DATA.vendors[d.v], n = Object.values((DATA.book || {})[d.v] || {}).filter(x => x && x !== BREAK).length;
      if (!confirm("למחוק את הטבלה של " + (v.name || "הספקית") + "?" + (n ? "\n" + plural(n, "תור תפוס אחד יימחק", "תורים תפוסים יימחקו") + "." : ""))) return;
      write("book/" + d.v, null); write("want/" + d.v, null); write("notes2/" + d.v, null); write("vendors/" + d.v, null);
      break;
    }
    case "add-person": {
      if (!isAdmin()) return;
      const id = uid("p");
      await write("people/" + id, { name: "", role: "", group: "girl", arrive: "", readyBy: "18:00", order: nextOrder(DATA.people) });
      requestAnimationFrame(() => { const el = document.getElementById("p-" + id + "-n"); if (el) el.focus(); });
      break;
    }
    case "del-person": {
      if (!isAdmin()) return;
      const used = Object.values(DATA.book || {}).some(m => Object.values(m || {}).includes(d.id));
      if (used) { alert("ל" + personName(d.id) + " יש תורים. קודם לפנות אותם, ואז אפשר למחוק."); return; }
      if (confirm("למחוק את " + personName(d.id) + " מהרשימה?")) write("people/" + d.id, null);
      break;
    }
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "offline") connect(); });
try { const s = sessionStorage.getItem("weddingPrep-screen"); if (ME && (s === "mine" || s === "full")) ui.screen = s; } catch (e) {}

connect();
})();
